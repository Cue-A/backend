name: Review Assign

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign:
    runs-on: ubuntu-latest
    # 이 저장소의 Actions 기본 토큰 권한이 read 라서, 명시하지 않으면 리뷰어·assignee 지정이
    # 403 으로 실패한다. 저장소 설정을 통째로 write 로 바꾸는 대신 이 잡에 필요한 권한만 준다.
    permissions:
      pull-requests: write
    steps:
      - uses: hkusu/review-assign-action@v1
        with:
          assignees: ${{ github.actor }}
          reviewers: ParkSeungHwan01, MinJuTur, leegain1
