# 전체 스택. 데모·발표 직전 통합 확인용입니다.
# 개발 중에는 docker-compose.dev.yml 을 쓰세요.
#   docker compose up -d --build
name: cue-a

services:
  postgres:
    extends:
      file: docker-compose.dev.yml
      service: postgres
    ports: []

  redis:
    extends:
      file: docker-compose.dev.yml
      service: redis
    ports: []

  minio:
    extends:
      file: docker-compose.dev.yml
      service: minio

  createbuckets:
    extends:
      file: docker-compose.dev.yml
      service: createbuckets
    depends_on:
      minio:
        condition: service_healthy

  spring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cue-a-spring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cuea}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cuea}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cuea}
      SPRING_DATA_REDIS_HOST: redis
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-cue-a-media}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-minioadmin}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-minioadmin}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET 를 .env 에 넣어주세요}
      APP_AI_SECRET: ${APP_AI_SECRET:-local-dev-only-ai-secret}
      APP_AI_MOCK_ENABLED: ${APP_AI_MOCK_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  # ── 아직 넣지 않은 서비스 ───────────────────────────────────
  # python-ai / frontend 는 docs/90-open-questions.md 4번(AI 서버 Dockerfile
  # 제공 여부)이 정해지면 추가합니다. 그때까지는 APP_AI_MOCK_ENABLED=true 로
  # 내부 MockAiClient 가 응답합니다.
  #
  # python-ai:
  #   build: ../cue-a-ai
  #   container_name: cue-a-python-ai
  #   environment:
  #     APP_AI_SECRET: ${APP_AI_SECRET}
  #   ports:
  #     - "8000:8000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
